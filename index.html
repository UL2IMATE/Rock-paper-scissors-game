<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="all.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h1>Rock Paper Scissors</h1>
      <p class="line"></p>
      <div class="buttons">
        <button class="Rock" id="Rock">Rock</button>
        <button class="Paper" id="Paper">Paper</button>
        <button class="Scissors" id="Scissors">Scissors</button>
      </div>

      <div class="message">
        <p id="message"></p>
      </div>
      <hr class="hr" />

      <div class="score">
        <p>You: <span class="score" id="Score"></span> <i class="fas fa-ellipsis-v"></i> Computer:  <span class="computer score" id="ComputerScore"></span></p>
      </div>
    </div>
      <footer>
        <p>&copy; 2023 Rock Paper Scissors. All rights reserved.</p>
        <p>Designed with ❤️ for gaming enthusiasts!</p>
      </footer>
    <script src="script.js"></script>
  </body>
</html>
