<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="all.css" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle dark and light mode">
      <svg class="theme-icon sun-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="theme-icon moon-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="container">
      <h1>Rock Paper Scissors</h1>
      <p class="line"></p>
      <div class="buttons">
        <button class="Rock" id="Rock">Rock</button>
        <button class="Paper" id="Paper">Paper</button>
        <button class="Scissors" id="Scissors">Scissors</button>
      </div>

      <div class="message">
        <p id="message"></p>
      </div>
      <hr class="hr" />

      <div class="score">
        <p>You: <span class="score" id="Score"></span> <i class="fas fa-ellipsis-v"></i> Computer:  <span class="computer score" id="ComputerScore"></span></p>
      </div>
    </div>
      <footer>
        <p>&copy; 2023 Rock Paper Scissors. All rights reserved.</p>
        <p>Designed with ❤️ for gaming enthusiasts!</p>
      </footer>
    <script src="script.js"></script>
  </body>
</html>
